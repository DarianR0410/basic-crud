<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas</title>
  <style>
    :root {
      --bg: #f4f6fb; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
      --primary: #2563eb; --danger: #dc2626; --ok: #16a34a; --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111827; --card: #1f2937; --text: #f3f4f6; --muted: #9ca3af; --border: #374151; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type=text] { flex: 1; min-width: 180px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1rem; }
    button { padding: 9px 14px; border-radius: 8px; border: 0; cursor: pointer; font-size: .9rem; color: #fff; background: var(--primary); }
    button.sec { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.del { background: var(--danger); }
    #error { color: var(--danger); font-size: .9rem; min-height: 1.2em; margin: 8px 0 0; }
    .stats { display: flex; gap: 12px; margin-bottom: 16px; }
    .stat { flex: 1; text-align: center; }
    .stat b { display: block; font-size: 1.5rem; }
    .stat span { color: var(--muted); font-size: .85rem; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    li:last-child { border-bottom: 0; }
    .id { color: var(--muted); font-size: .85rem; min-width: 32px; }
    .titulo { flex: 1; word-break: break-word; }
    .hecha .titulo { text-decoration: line-through; color: var(--muted); }
    .badge { font-size: .75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .hecha .badge { color: var(--ok); border-color: var(--ok); }
    .vacio { text-align: center; color: var(--muted); padding: 16px 0; }
    .acciones { display: flex; gap: 6px; }
  </style>
</head>
<body>
<main>
  <h1>Gestor de Tareas</h1>
  <p class="sub">CRUD de la Tarea 3 - Git y Git Flow. Los datos se guardan en tu navegador.</p>

  <div class="card">
    <form id="form" autocomplete="off">
      <input type="text" id="titulo" placeholder="Titulo de la tarea" maxlength="120">
      <button type="submit" id="guardar">Agregar</button>
      <button type="button" class="sec" id="cancelar" hidden>Cancelar</button>
    </form>
    <p id="error" role="alert"></p>
  </div>

  <div class="stats">
    <div class="card stat"><b id="total">0</b><span>Total</span></div>
    <div class="card stat"><b id="pend">0</b><span>Pendientes</span></div>
    <div class="card stat"><b id="hechas">0</b><span>Hechas</span></div>
  </div>

  <div class="card"><ul id="lista"></ul></div>
</main>

<script>
  const CLAVE = "tareas";
  const $ = (id) => document.getElementById(id);
  let editandoId = null;

  function cargar() {
    try { return JSON.parse(localStorage.getItem(CLAVE)) || []; }
    catch (e) { return []; }
  }
  function guardar(tareas) {
    try { localStorage.setItem(CLAVE, JSON.stringify(tareas)); } catch (e) {}
  }

  // CREATE y UPDATE
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const titulo = $("titulo").value.trim();
    if (!titulo) { $("error").textContent = "El titulo no puede estar vacio."; return; }
    $("error").textContent = "";
    const tareas = cargar();
    if (editandoId !== null) {
      const t = tareas.find((x) => x.id === editandoId);
      if (t) t.titulo = titulo;
    } else {
      const id = tareas.length ? Math.max(...tareas.map((t) => t.id)) + 1 : 1;
      tareas.push({ id, titulo, estado: "pendiente" });
    }
    guardar(tareas);
    salirEdicion();
    pintar();
  });

  $("cancelar").addEventListener("click", salirEdicion);

  function salirEdicion() {
    editandoId = null;
    $("titulo").value = "";
    $("guardar").textContent = "Agregar";
    $("cancelar").hidden = true;
    $("error").textContent = "";
  }

  function editar(id) {
    const t = cargar().find((x) => x.id === id);
    if (!t) return;
    editandoId = id;
    $("titulo").value = t.titulo;
    $("guardar").textContent = "Guardar cambios";
    $("cancelar").hidden = false;
    $("titulo").focus();
  }

  function alternar(id) {
    const tareas = cargar();
    const t = tareas.find((x) => x.id === id);
    if (t) t.estado = t.estado === "hecha" ? "pendiente" : "hecha";
    guardar(tareas);
    pintar();
  }

  // DELETE
  function eliminar(id) {
    if (!confirm("Eliminar esta tarea?")) return;
    guardar(cargar().filter((t) => t.id !== id));
    if (editandoId === id) salirEdicion();
    pintar();
  }

  // READ
  function pintar() {
    const tareas = cargar();
    const lista = $("lista");
    lista.innerHTML = "";
    if (!tareas.length) {
      lista.innerHTML = '<li class="vacio">No hay tareas todavia.</li>';
    }
    tareas.forEach((t) => {
      const li = document.createElement("li");
      if (t.estado === "hecha") li.className = "hecha";

      const id = document.createElement("span");
      id.className = "id"; id.textContent = "#" + t.id;

      const titulo = document.createElement("span");
      titulo.className = "titulo"; titulo.textContent = t.titulo;

      const badge = document.createElement("span");
      badge.className = "badge"; badge.textContent = t.estado;

      const acciones = document.createElement("div");
      acciones.className = "acciones";
      acciones.append(
        boton(t.estado === "hecha" ? "Reabrir" : "Hecha", "sec", () => alternar(t.id)),
        boton("Editar", "sec", () => editar(t.id)),
        boton("Eliminar", "del", () => eliminar(t.id))
      );
      li.append(id, titulo, badge, acciones);
      lista.appendChild(li);
    });
    const hechas = tareas.filter((t) => t.estado === "hecha").length;
    $("total").textContent = tareas.length;
    $("hechas").textContent = hechas;
    $("pend").textContent = tareas.length - hechas;
  }

  function boton(texto, clase, fn) {
    const b = document.createElement("button");
    b.type = "button"; b.className = clase; b.textContent = texto;
    b.addEventListener("click", fn);
    return b;
  }

  pintar();
</script>
</body>
</html>
